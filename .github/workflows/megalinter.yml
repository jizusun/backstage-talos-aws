name: MegaLinter

on:
  pull_request:
    branches: [main]

jobs:
  megalinter:
    name: MegaLinter (Terraform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oxsecurity/megalinter/flavors/terraform@v9.5.0
        env:
          VALIDATE_ALL_CODEBASE: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_LINTERS: >-
            TERRAFORM_TFLINT,
            TERRAFORM_TERRAFORM_FMT,
            REPOSITORY_CHECKOV,
            REPOSITORY_GITLEAKS,
            REPOSITORY_TRIVY,
            YAML_YAMLLINT,
            ACTION_ACTIONLINT,
            DOCKERFILE_HADOLINT,
            KUBERNETES_HELM,
            MARKDOWN_MARKDOWNLINT
          DISABLE_LINTERS: TERRAFORM_TERRASCAN
          TERRAFORM_TFLINT_CONFIG_FILE: terraform/.tflint.hcl
          REPORT_OUTPUT_FOLDER: megalinter-reports

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MegaLinter-reports
          path: megalinter-reports
