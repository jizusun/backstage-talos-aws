name: PR Validation

on:
  pull_request:
    branches: [main]

env:
  MISE_DISABLE_TOOLS: talosctl

jobs:
  unit-tests:
    name: "Layer 1: Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: OpenTofu Init & Validate
        working-directory: terraform/
        run: |
          tofu init -backend=false
          tofu fmt -check -recursive
          tofu validate

      - name: tflint
        working-directory: terraform/
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

      - name: Trivy
        run: trivy config terraform/ --severity HIGH,CRITICAL --exit-code 0

      - name: OPA Policy Tests
        run: opa test policies/opa/ -v

      - name: Helm Lint & Template
        run: |
          helm lint charts/backstage/
          helm template backstage charts/backstage/ --values charts/backstage/values/local.yaml > /dev/null

  integration-tests:
    name: "Layer 2: Integration Tests"
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Terratest
        run: go test -v -timeout 5m
        working-directory: terraform/test/

      - name: Kind + Helm Dry-Run
        run: |
          kind create cluster --name backstage-test --wait 60s
          helm install backstage charts/backstage/ --values charts/backstage/values/local.yaml \
            --kube-context kind-backstage-test --dry-run > /dev/null
          echo "✅ Helm dry-run on Kind passed"
          kind delete cluster --name backstage-test

      - name: OPA Approval Policy
        run: |
          echo '{"environment":"production","approval_status":"pending"}' > /tmp/prod.json
          opa eval -d policies/opa/ -i /tmp/prod.json "data.deployment.approval.allow" | grep -q "false"
          echo "✅ Production blocked without approval"
          echo '{"environment":"dev"}' > /tmp/dev.json
          opa eval -d policies/opa/ -i /tmp/dev.json "data.deployment.approval.allow" | grep -q "true"
          echo "✅ Dev allowed without approval"

      - name: Secret Scan
        run: |
          bun .mise/tasks/scan > /tmp/file_scan.json
          RESULT=$(opa eval -d policies/opa/secret-scanning.rego -i /tmp/file_scan.json "data.security.secrets.violation")
          if echo "$RESULT" | grep -q '"msg"'; then
            echo "❌ Secrets detected" && exit 1
          fi
          echo "✅ No secrets detected"
