name: Application Deployment

on:
  push:
    branches: [main]
    paths: ["charts/**", "backstage/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, test, perf, staging, production]

env:
  AWS_REGION: us-east-1

jobs:
  build:
    name: Build & Scan
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2
        id: ecr

      - name: Build & Push
        run: |
          IMAGE="${STEPS_ECR_OUTPUTS_REGISTRY}/backstage-${APP_ENV}/backstage"
          docker build -t "$IMAGE:${GIT_SHA}" -t "$IMAGE:latest" .
          docker push "$IMAGE" --all-tags
        env:
          STEPS_ECR_OUTPUTS_REGISTRY: ${{ steps.ecr.outputs.registry }}
          APP_ENV: ${{ github.event.inputs.environment || 'dev' }}
          GIT_SHA: ${{ github.sha }}

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Trivy Scan
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL "${STEPS_ECR_OUTPUTS_REGISTRY}/backstage-${APP_ENV}/backstage:${GIT_SHA}"
        env:
          STEPS_ECR_OUTPUTS_REGISTRY: ${{ steps.ecr.outputs.registry }}
          APP_ENV: ${{ github.event.inputs.environment || 'dev' }}
          GIT_SHA: ${{ github.sha }}

  test:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Secret Scan
        run: |
          bun .mise/tasks/scan > /tmp/file_scan.json
          RESULT=$(opa eval -d policies/opa/secret-scanning.rego -i /tmp/file_scan.json "data.security.secrets.violation")
          if echo "$RESULT" | grep -q '"msg"'; then
            echo "❌ Secrets detected" && exit 1
          fi
          echo "✅ No secrets"

      - name: Helm Lint
        run: helm lint charts/backstage/

  deploy:
    name: Deploy ("${APP_ENV}")
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: "${APP_ENV}"
    env:
      ENV: "${APP_ENV}"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Kubeconfig
        run: |
          aws s3 cp s3://backstage-platform-tfstate/kubeconfig/"${ENV}"/kubeconfig ./kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> "$GITHUB_ENV"

      - name: Helm Deploy
        run: |
          helm upgrade --install backstage charts/backstage/ \
            --values charts/backstage/values/"${ENV}".yaml \
            --set image.tag="${NEEDS_BUILD_OUTPUTS_IMAGE_TAG}" \
            --wait --timeout 10m
        env:
          NEEDS_BUILD_OUTPUTS_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

      - name: Health Check
        run: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=backstage --timeout=300s
